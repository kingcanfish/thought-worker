# 构建端镜像（Dockerfile.publisher）推到 ghcr，给 K8s CronJob 拉取（deploy/k8s/publisher.yaml）。
# 标签：latest（main 最新代码）+ sha-<commit>。CronJob 用 latest + imagePullPolicy: Always，部署的总是最新代码
name: image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "demo/**", "deploy/**", "**.md"]

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 测试不过不推镜像：定时任务会直接用 latest 部署
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-publisher
          tags: |
            type=raw,value=latest
            type=sha
      # amd64 + arm64：小主机可能是 ARM
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.publisher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
