# 每天定时构建：处理收件箱里的新消息，有变化才渲染并部署。
# 需要的 Secrets：BOT_TOKEN、R2_ACCOUNT_ID、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY、CLOUDFLARE_API_TOKEN
name: build

on:
  schedule:
    - cron: "0 20 * * *" # 每天 04:00（Asia/Shanghai）
  workflow_dispatch: # 手动触发：立即构建（即使没有新消息）
  push:
    branches: [main]
    paths-ignore: ["docs/**", "demo/**", "**.md"]

# 同一时间只跑一个构建，避免两次构建同时回写数据库
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 构建并部署
        run: npm run build:site
        env:
          # 定时任务只在有新消息时构建；手动触发和推送代码时强制构建
          FORCE: ${{ github.event_name != 'schedule' && '1' || '' }}
          STORAGE: r2
          R2_BUCKET: thought-worker-media
          R2_DATA_BUCKET: thought-worker-data
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEPLOY_COMMAND: npx wrangler deploy
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
