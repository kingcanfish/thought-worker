# 每天定时构建：处理收件箱里的新消息，有变化才渲染并部署。
# 需要的 Secrets：BOT_TOKEN、CLOUDFLARE_ACCOUNT_ID、CLOUDFLARE_API_TOKEN（Workers + D1 编辑权限）、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY
# D1 数据库 ID 从 wrangler.toml 读取
name: build

on:
  schedule:
    - cron: "0 20 * * *" # 每天 04:00（Asia/Shanghai）
  workflow_dispatch: # 手动触发：立即构建（即使没有新消息）
  push:
    branches: [main]
    paths-ignore: ["docs/**", "demo/**", "**.md"]

# 同一时间只跑一个构建，避免两次构建同时回写数据库
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # 先迁移再部署：新版 Worker 上线时表结构已经就绪
      - name: 数据库迁移
        run: npx wrangler d1 migrations apply thought-worker --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 图片要拷进站点目录（STATIC_MEDIA）：缓存下来，每次构建只下载新图片。文件名不会变，缓存不会过期
      - name: 图片缓存
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-${{ github.run_id }}
          restore-keys: media-
      - name: 读取 D1 数据库 ID
        run: echo "D1_DATABASE_ID=$(sed -n 's/^database_id *= *"\(.*\)"/\1/p' wrangler.toml)" >> "$GITHUB_ENV"
      - name: 构建并部署
        run: npm run build:site
        env:
          # 定时任务只在有新消息时构建；手动触发和推送代码时强制构建
          FORCE: ${{ github.event_name != 'schedule' && '1' || '' }}
          DB: d1
          STORAGE: r2
          R2_BUCKET: thought-worker-media
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STATIC_MEDIA: "1"
          STATIC_MEDIA_CACHE: .cache/media
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEPLOY_COMMAND: npx wrangler deploy
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
