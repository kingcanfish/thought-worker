# 接收端 + 静态站点。页面和图片由 [assets] 直接提供（不计 Worker 请求，构建时 STATIC_MEDIA=1 把图片拷进 dist/site/m）；
# 只有 /tg/webhook 和 /m/* 里的视频会执行 Worker。站点由 `npm run build:site` 生成到 dist/site。
name = "thought-worker"
main = "src/adapters/cloudflare/index.ts"
compatibility_date = "2026-09-01"

# 自定义域名：部署时自动建 DNS 记录和证书（域名需托管在 Cloudflare）。媒体的边缘缓存只在自定义域名上生效
routes = [{ pattern = "memos.gxy.plus", custom_domain = true }]

[assets]
directory = "./dist/site"
binding = "ASSETS"
not_found_handling = "404-page"

# 图片视频。不要开公开访问（r2.dev / 自定义域名直出）：访客只经 Worker 的 /m 读取（视频），
# 读取次数就被 Workers 免费版每天 10 万次请求封顶，不会超出 R2 免费额度；图片由构建端读出后作为静态资源部署
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "thought-worker-media"

# 帖子、收件箱、构建锁。迁移：npx wrangler d1 migrations apply thought-worker --remote
[[d1_databases]]
binding = "DB"
database_name = "thought-worker"
database_id = "acdb3d6e-dd3f-4748-9bab-9e6b6bf10ec1"
migrations_dir = "migrations"

[vars]
# 和 site.env 里的 CHANNEL_ID 保持一致；配了它和 BOT_TOKEN，/del 会立即删除频道里的消息，不等构建
CHANNEL_ID = "-1003912012983"
# 防盗链：除本站和 SITE_URL 外，还允许引用 /m 媒体的站点（逗号分隔的 host）
MEDIA_ALLOWED_REFERERS = ""

# 密钥用 `wrangler secret put` 设置（本地开发写在 .dev.vars）：
#   WEBHOOK_SECRET  必需
#   BOT_TOKEN       可选，/del 立即删除用
