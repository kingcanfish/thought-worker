# 接收端 + 静态站点。页面由 [assets] 直接提供（不计 Worker 请求）；
# 只有 /tg/webhook 和 /m/*（媒体）会执行 Worker。站点由 `npm run build:site` 生成到 dist/site。
name = "thought-worker"
main = "src/adapters/cloudflare/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist/site"
binding = "ASSETS"
not_found_handling = "404-page"

# 图片视频。不要开公开访问（r2.dev / 自定义域名直出）：只经 Worker 的 /m 读取，
# 读取次数就被 Workers 免费版每天 10 万次请求封顶，不会超出 R2 免费额度
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "thought-worker-media"

# 帖子、收件箱、构建锁。迁移：npx wrangler d1 migrations apply thought-worker --remote
[[d1_databases]]
binding = "DB"
database_name = "thought-worker"
database_id = ""
migrations_dir = "migrations"

[vars]
# 和 site.env 里的 CHANNEL_ID 保持一致；配了它和 BOT_TOKEN，/del 会立即删除频道里的消息，不等构建
CHANNEL_ID = ""
# 防盗链：除本站和 SITE_URL 外，还允许引用 /m 媒体的站点（逗号分隔的 host）
MEDIA_ALLOWED_REFERERS = ""

# 密钥用 `wrangler secret put` 设置（本地开发写在 .dev.vars）：
#   WEBHOOK_SECRET  必需
#   BOT_TOKEN       可选，/del 立即删除用
