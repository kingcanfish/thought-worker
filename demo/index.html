<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)" />
<title>碎碎念</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #faf8f5;
    --bg-soft: #f3efe9;
    --text: #2b2926;
    --text-2: #5c5750;
    --muted: #9a948b;
    --line: #ebe6de;
    --accent: #b4532a;
    --accent-soft: #f6e6dc;
    --heat-0: #ece7df;
    --heat-1: #f0cdb8;
    --heat-2: #e2a07c;
    --heat-3: #cc7448;
    --heat-4: #a8491f;
    --shadow: 0 1px 2px rgba(40, 30, 20, .04), 0 8px 24px rgba(40, 30, 20, .06);
    --serif: "Fraunces", "Songti SC", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161514; --bg-soft: #1f1d1b; --text: #e9e5df; --text-2: #bdb7ae; --muted: #837d74;
      --line: #2b2926; --accent: #e3905f; --accent-soft: #3a2519;
      --heat-0: #262422; --heat-1: #4a2e1f; --heat-2: #7a4629; --heat-3: #b0643a; --heat-4: #e3905f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161514; --bg-soft: #1f1d1b; --text: #e9e5df; --text-2: #bdb7ae; --muted: #837d74;
    --line: #2b2926; --accent: #e3905f; --accent-soft: #3a2519;
    --heat-0: #262422; --heat-1: #4a2e1f; --heat-2: #7a4629; --heat-3: #b0643a; --heat-4: #e3905f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15.5px/1.75 var(--sans); letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; touch-action: manipulation; }

  .shell {
    max-width: 980px; margin: 0 auto; padding: 56px 24px 96px;
    display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 64px;
  }

  /* ───── Sidebar ───── */
  aside { position: sticky; top: 56px; align-self: start; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #d9a441);
    display: grid; place-items: center; color: #fff;
    font: 600 22px/1 var(--serif);
  }
  .name { margin: 16px 0 2px; font: 600 22px/1.3 var(--serif); letter-spacing: 0; }
  .bio { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .stats { display: flex; gap: 20px; margin: 22px 0 26px; }
  .stat b { display: block; font: 600 20px/1.2 var(--serif); }
  .stat span { font-size: 12px; color: var(--muted); }

  .section-title { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin: 0 0 10px; }
  .heatmap { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); gap: 3px; margin-bottom: 28px; }
  .heatmap i { width: 9px; height: 9px; border-radius: 2px; background: var(--heat-0); }
  .heatmap i[data-l="1"] { background: var(--heat-1); }
  .heatmap i[data-l="2"] { background: var(--heat-2); }
  .heatmap i[data-l="3"] { background: var(--heat-3); }
  .heatmap i[data-l="4"] { background: var(--heat-4); }
  .heatmap i[data-day] { cursor: pointer; transition: transform .12s; }
  @media (hover: hover) { .heatmap i[data-day]:hover { transform: scale(1.35); } }
  .heatmap i.sel { outline: 1.5px solid var(--text); outline-offset: 1px; }
  .heatmap-legend { display: flex; justify-content: space-between; align-items: center; margin: -18px 0 28px; font-size: 11px; color: var(--muted); }
  .heatmap-legend span { display: flex; gap: 3px; align-items: center; }
  .heatmap-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-chip {
    font-size: 13px; padding: 3px 10px; border-radius: 999px;
    background: var(--bg-soft); color: var(--text-2);
    transition: background .15s, color .15s;
  }
  .tag-chip small { color: var(--muted); margin-left: 3px; font-size: 11px; }
  .tag-chip:hover, .tag-chip.active { background: var(--accent-soft); color: var(--accent); }
  .tag-chip.active small { color: var(--accent); }

  .side-foot { margin-top: 32px; display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }
  .side-foot a { text-decoration: none; }
  .side-foot a:hover { color: var(--accent); }

  /* ───── Toolbar ───── */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .search {
    flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px; border-radius: 10px;
    background: var(--bg-soft); color: var(--muted);
    border: 1px solid transparent; transition: border-color .15s, background .15s;
  }
  .search:focus-within { border-color: var(--line); background: var(--bg); }
  .search svg { flex: none; }
  .search input { flex: 1; min-width: 0; width: 100%; text-overflow: ellipsis; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 14px; }
  .icon-btn {
    flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    color: var(--text-2); background: var(--bg-soft);
  }
  .icon-btn:hover, .icon-btn.on { color: var(--accent); }
  .icon-btn.on { background: var(--accent-soft); }

  /* date picker */
  .cal-wrap { position: relative; flex: none; }
  .cal {
    position: absolute; right: 0; top: 46px; z-index: 20;
    width: min(288px, calc(100vw - 32px)); padding: 14px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    animation: pop .16s ease both;
  }
  .cal[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head span { font: 600 15px/1 var(--serif); }
  .cal-head button { width: 28px; height: 28px; border-radius: 8px; color: var(--text-2); }
  .cal-head button:hover { background: var(--bg-soft); color: var(--accent); }
  .cal-week, .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .cal-week { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .cal-days button {
    position: relative; height: 34px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text);
  }
  .cal-days button span { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; transition: background .12s; }
  .cal-days button:hover:not(:disabled) span { background: var(--bg-soft); }
  .cal-days button.has::after {
    content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px;
    border-radius: 50%; background: var(--accent);
  }
  .cal-days button.today span { box-shadow: inset 0 0 0 1px var(--line); }
  .cal-days button.out { color: var(--muted); opacity: .45; }
  .cal-days button:disabled { color: var(--muted); opacity: .3; cursor: default; }
  .cal-days button.r-in { background: var(--accent-soft); }
  .cal-days button.r-start { border-radius: 17px 0 0 17px; }
  .cal-days button.r-end { border-radius: 0 17px 17px 0; }
  .cal-days button.r-start.r-end { border-radius: 17px; background: none; }
  .cal-days button.r-start span, .cal-days button.r-end span { background: var(--accent) !important; color: #fff; }
  .cal-days button.r-start.has::after, .cal-days button.r-end.has::after { background: #fff; }
  .cal-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .cal-presets button { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--bg-soft); color: var(--text-2); }
  .cal-presets button:hover { color: var(--accent); background: var(--accent-soft); }
  .cal-presets button[data-preset="clear"] { margin-left: auto; background: none; color: var(--muted); }
  .cal-hint { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }
  .filter-bar { min-height: 28px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .filter-bar .tag-chip { background: var(--accent-soft); color: var(--accent); }

  /* ───── Timeline ───── */
  .day { position: relative; }
  .day-head {
    position: sticky; top: var(--stick, 0px); z-index: 2;
    display: flex; align-items: baseline; gap: 10px;
    padding: 18px 0 10px; background: var(--bg);
  }
  .day-num { font: 400 34px/1 var(--serif); letter-spacing: -.02em; }
  .day-meta { font-size: 13px; color: var(--muted); }
  .day-meta em { font-style: normal; color: var(--accent); margin-left: 6px; }

  .post { padding: 18px 0 20px; border-top: 1px solid var(--line); animation: rise .4s ease both; }
  .day-head + .post { border-top: 0; padding-top: 6px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .post-time { font: 500 12.5px/1 var(--mono); color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .post-time .edited { font-family: var(--sans); font-size: 11.5px; }
  .content { word-break: break-word; }
  .content p { margin: 0 0 .5em; }
  .content p:last-child { margin-bottom: 0; }
  .content a:not(.hashtag) { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
  .content code { font: 13.5px var(--mono); background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; }
  .content pre { font: 13px/1.6 var(--mono); background: var(--bg-soft); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: .6em 0; }
  .content blockquote { margin: .6em 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--line); color: var(--text-2); }
  .hashtag { color: var(--accent); text-decoration: none; }
  .hashtag:hover { text-decoration: underline; text-underline-offset: 3px; }
  .spoiler { background: var(--text); color: transparent; border-radius: 3px; cursor: pointer; transition: all .2s; }
  .spoiler.show { background: var(--bg-soft); color: inherit; }
  mark { background: var(--accent-soft); color: var(--accent); border-radius: 2px; padding: 0 1px; }

  /* media grid */
  .grid { margin-top: 12px; display: grid; gap: 4px; border-radius: 12px; overflow: hidden; max-width: 520px; }
  .grid .m { position: relative; overflow: hidden; background: var(--bg-soft); cursor: zoom-in; aspect-ratio: 1; }
  .grid .m img, .grid .m video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  @media (hover: hover) { .grid .m:hover img { transform: scale(1.02); } }
  .g1 { grid-template-columns: 1fr; }
  .g1 .m { aspect-ratio: auto; max-height: 420px; }
  .g1 .m img { max-height: 420px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 3 / 2; }
  .g3 .m { aspect-ratio: auto; }
  .g3 .m:first-child { grid-row: span 2; }
  .g4 { grid-template-columns: 1fr 1fr; max-width: 400px; }
  .gn { grid-template-columns: repeat(3, 1fr); }
  /* 转发来源 */
  .fwd { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
  .fwd a { color: var(--text-2); text-decoration: none; }
  .fwd a:hover { color: var(--accent); }

  /* 链接预览卡片 */
  .link-card {
    display: block; margin-top: 12px; max-width: 520px; overflow: hidden;
    border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  .link-card:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: color-mix(in srgb, var(--bg-soft) 50%, var(--bg)); }
  .link-card .cover { display: block; width: 100%; aspect-ratio: 1.91 / 1; object-fit: cover; background: var(--bg-soft); }
  .link-body { padding: 11px 14px 13px; min-width: 0; }
  .link-site { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .link-site img { width: 14px; height: 14px; border-radius: 3px; }
  .link-title { margin: 3px 0 2px; font-size: 14.5px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .link-desc { font-size: 13px; line-height: 1.55; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .link-card.small { display: grid; grid-template-columns: minmax(0, 1fr) 92px; }
  .link-card.small .thumb { width: 92px; height: 100%; min-height: 92px; object-fit: cover; background: var(--bg-soft); }

  .more-badge { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.45); color: #fff; font: 600 22px var(--serif); }

  .m.video { cursor: pointer; }
  .play {
    position: absolute; inset: 0; display: grid; place-items: center;
  }
  .play span {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.9); color: #222; box-shadow: var(--shadow);
    transition: transform .2s;
  }
  @media (hover: hover) { .m.video:hover .play span { transform: scale(1.08); } }
  .duration, .gif-badge {
    position: absolute; right: 8px; bottom: 8px; padding: 1px 7px; border-radius: 6px;
    font: 500 11.5px/1.6 var(--mono); color: #fff; background: rgba(0,0,0,.55);
  }
  .gif-badge { left: 8px; right: auto; font-family: var(--sans); letter-spacing: .05em; }
  .too-large { position: absolute; left: 8px; top: 8px; right: 8px; font-size: 12px; color: #fff; }
  .too-large a { display: inline-block; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.55); text-decoration: none; }

  .post-actions { margin-top: 10px; display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); transition: opacity .2s; }
  @media (hover: hover) and (pointer: fine) {
    .post-actions { opacity: 0; }
    .post:hover .post-actions, .post:focus-within .post-actions { opacity: 1; }
  }
  .post-actions button, .post-actions a { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
  .post-actions button:hover, .post-actions a:hover { color: var(--accent); }

  .end { text-align: center; color: var(--muted); font-size: 12.5px; padding: 36px 0 0; letter-spacing: .1em; }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); }

  /* ───── Lightbox ───── */
  .lb {
    position: fixed; inset: 0; z-index: 50; background: rgba(12,10,8,.92);
    display: none; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s;
  }
  .lb.open { display: flex; opacity: 1; }
  .lb img { max-width: 92vw; max-height: 86vh; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.5); user-select: none; }
  .lb-btn { position: absolute; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.08); }
  .lb-btn:hover { background: rgba(255,255,255,.18); }
  .lb-close { top: 20px; right: 20px; }
  .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }
  .lb-count { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.7); font: 13px var(--mono); }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .to-top {
    position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 15;
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    background: var(--bg); color: var(--text-2); border: 1px solid var(--line); box-shadow: var(--shadow);
    opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
  .sheet-mask { display: none; }

  /* ───── Tablet ───── */
  @media (max-width: 900px) and (min-width: 761px) {
    .shell { grid-template-columns: 200px minmax(0, 1fr); gap: 40px; }
  }

  /* ───── Mobile ───── */
  @media (max-width: 760px) {
    body { font-size: 15px; }
    .shell {
      grid-template-columns: minmax(0, 1fr); gap: 16px;
      padding: calc(20px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(72px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    /* 顶部简介：头像 + 名字 + 简介，统计压成一行，标签横滑 */
    aside { position: static; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; align-items: center; }
    .avatar { width: 48px; height: 48px; font-size: 19px; grid-row: span 2; }
    .name { margin: 0; font-size: 19px; }
    .bio { font-size: 13px; }
    .bio br { display: none; }
    .stats { grid-column: 1 / -1; margin: 14px 0 0; gap: 18px; }
    .stat { display: flex; align-items: baseline; gap: 4px; }
    .stat b { display: inline; font-size: 16px; }
    .heatmap-wrap, .side-foot { display: none; }
    .tags-wrap { grid-column: 1 / -1; min-width: 0; margin-top: 14px; }
    .tags {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 24px), transparent);
              mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 24px), transparent);
    }
    .tags::-webkit-scrollbar { display: none; }
    .tag-chip { white-space: nowrap; padding: 5px 12px; }
    .tags-wrap .section-title { display: none; }

    /* 吸顶工具栏：搜索 + 日历 + 主题 + 筛选条件 */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      margin: 0 -16px; padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
      border-bottom: 1px solid transparent; transition: border-color .2s;
    }
    .topbar::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
    }
    .topbar.stuck { border-bottom-color: var(--line); }
    .toolbar { margin-bottom: 0; }
    .search { height: 40px; }
    .search input { font-size: 16px; }       /* < 16px 时 iOS 聚焦会自动放大页面 */
    .icon-btn { width: 40px; height: 40px; }
    .filter-bar { min-height: 0; margin: 8px 0 0; flex-wrap: wrap; }
    .filter-bar:empty { display: none; }

    .day-head { padding: 14px 0 8px; }
    .day-num { font-size: 30px; }

    /* 媒体：撑满内容宽度，单图限高 */
    .grid { max-width: none; gap: 3px; border-radius: 10px; }
    .g4, .link-card { max-width: none; }
    .link-card.small { grid-template-columns: minmax(0, 1fr) 84px; }
    .link-card.small .thumb { width: 84px; min-height: 84px; }
    .g1 .m, .g1 .m img { max-height: 70vh; }
    .play span { width: 46px; height: 46px; }

    .post-actions { gap: 18px; }
    .post-actions button, .post-actions a { padding: 4px 0; }

    /* 日历 → 底部抽屉 */
    .sheet-mask {
      display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.32);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    body.sheet-open .sheet-mask { opacity: 1; pointer-events: auto; }
    body.sheet-open { overflow: hidden; }
    .cal {
      position: fixed; left: 0; right: 0; top: auto; bottom: 0; z-index: 31; width: auto;
      max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
      padding: 8px max(18px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      border: 0; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,.14);

    }

    @keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
    .cal-head { margin-bottom: 12px; }

    .cal-presets { gap: 8px; margin-top: 14px; padding-top: 14px; }
    .cal-presets button { font-size: 14px; padding: 7px 14px; }

    /* 灯箱：全宽、下滑关闭 */
    .lb img { max-width: 100vw; max-height: 80vh; border-radius: 0; box-shadow: none; transition: transform .2s, opacity .2s; }
    .lb-close { top: calc(12px + env(safe-area-inset-top)); right: 12px; }
    .lb-count { bottom: calc(20px + env(safe-area-inset-bottom)); }
    .lb-prev, .lb-next { display: none; }

    .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
    .to-top { right: max(16px, env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

        <span>点格子按天筛选</span>

  <main>
    <div class="topbar" id="topbar">
    <div class="toolbar">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索碎碎念…" autocomplete="off" />
      </label>

          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </button>

          </div>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="lb-btn lb-close" data-act="close" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <button class="lb-btn lb-prev" data-act="prev" aria-label="上一张"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>

<script>
/* ── Mock data：结构与 /api/posts 返回一致 ── */
const now = new Date();
const at = (dayOffset, h, m) => { const d = new Date(now); d.setDate(d.getDate() - dayOffset); d.setHours(h, m, 0, 0); return d; };
const pic = (seed, w, h) => ({ kind: "photo", url: `https://picsum.photos/seed/${seed}/${w}/${h}`, w, h });
const VIDEO = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

const POSTS = [
  { id: 12, at: at(0, 22, 41), html: "<p>凌晨前最后一条：把 webhook 调通了，频道里发一句，网页上立刻就出现，这种<b>即时反馈</b>真的很上头。</p><p><a class='hashtag' data-tag='折腾'>#折腾</a></p>", media: [] },
  { id: 11, at: at(0, 18, 5), html: "<p>下班路上的天，粉得不太真实。</p>", media: [pic("dusk1", 1200, 800), pic("dusk2", 800, 1000), pic("dusk3", 1000, 1000)], tags: ["日常"] },
  { id: 10, at: at(0, 12, 30), edited: true, html: "<p>午饭试了楼下新开的面馆，汤头不错，面有点软。给个 <code>7/10</code>。</p><p><a class='hashtag' data-tag='吃'>#吃</a></p>", media: [pic("noodle", 1080, 1080)] },
  { id: 13, at: at(0, 15, 36), html: "<p>这篇讲 Workers 静态资源的文章写得很清楚，终于不用纠结 Pages 还是 Workers 了。</p><p><a href='#'>example.dev/posts/workers-fullstack</a></p>", media: [],
    link: { layout: "large", site: "example.dev", title: "在 Workers 上跑全栈应用：一次迁移笔记", desc: "把一个 Next.js 小站迁到 Cloudflare Workers 的全过程：静态资源、D1、R2、缓存策略，以及踩过的坑。", image: "https://picsum.photos/seed/workers/1200/628", url: "#" }, tags: ["折腾"] },
  { id: 9, at: at(0, 9, 12), html: "<blockquote>The best way to get a good idea is to get a lot of ideas.</blockquote><p>所以这个网站就是用来装那些「不太好」的 idea 的。</p>", media: [] },
  { id: 8, at: at(1, 21, 18), html: "<p>周末去海边拍的，风很大，相机差点被吹跑。</p><p><a class='hashtag' data-tag='旅行'>#旅行</a> <a class='hashtag' data-tag='摄影'>#摄影</a></p>", media: [pic("sea1", 1200, 800), pic("sea2", 1200, 800), pic("sea3", 800, 1200), pic("sea4", 1200, 900), pic("sea5", 1000, 1000), pic("sea6", 1200, 800)] },
  { id: 7, at: at(1, 16, 47), html: "<p>院子里的花开了，录了一小段。</p>", media: [{ kind: "video", url: VIDEO, poster: "https://picsum.photos/seed/flower/1280/720", w: 1280, h: 720, duration: 5 }], tags: ["日常"] },
  { id: 14, at: at(1, 13, 40), forward: { name: "每日一图", url: "#" }, html: "<p>今天的每日一图，冰岛的黑沙滩。</p>", media: [pic("iceland", 1200, 800)], tags: ["摄影"] },
  { id: 6, at: at(1, 10, 3), html: "<p>Cloudflare D1 的 FTS5 可以用 <code>tokenize='trigram'</code> 搞定中文搜索，记一下：</p><pre>CREATE VIRTUAL TABLE posts_fts\n  USING fts5(text, tokenize='trigram');</pre><p>参考 <a href='https://www.sqlite.org/fts5.html' target='_blank'>SQLite 文档</a> <a class='hashtag' data-tag='折腾'>#折腾</a></p>", media: [] },
  { id: 5, at: at(3, 23, 50), html: "<p>剧透警告：<span class='spoiler' title='点击显示'>凶手其实是管家</span>。好了，可以睡了。</p><p><a class='hashtag' data-tag='电影'>#电影</a></p>", media: [] },
  { id: 16, at: at(3, 20, 12), forward: { name: "一位朋友" }, html: "<blockquote>人生就是一边丢东西，一边捡东西。</blockquote>", media: [] },
  { id: 4, at: at(3, 15, 20), html: "<p>猫今天又把杯子推下去了，还理直气壮地看着我。</p>", media: [pic("cat1", 900, 900), pic("cat2", 900, 900)], tags: ["猫"] },
  { id: 15, at: at(3, 11, 5), html: "<p>准备用 Hono 写后端，API 跟 Express 很像但轻得多，原生支持 Workers。</p><p><a href='#'>github.com/honojs/hono</a></p>", media: [],
    link: { layout: "small", site: "GitHub", title: "honojs/hono: Web framework built on Web Standards", desc: "Fast, lightweight, built on Web Standards. Support for any JavaScript runtime.", image: "https://picsum.photos/seed/hono/400/400", url: "#" }, tags: ["折腾"] },
  { id: 3, at: at(3, 8, 40), html: "<p>早起跑了 5 公里，配速 6'10''，比上周快一点。</p><p><a class='hashtag' data-tag='跑步'>#跑步</a></p>", media: [{ kind: "gif", url: VIDEO, poster: "https://picsum.photos/seed/run/800/800", w: 800, h: 800 }] },
  { id: 2, at: at(5, 20, 0), html: "<p>一段很长的 vlog，超过了 20MB 只能在 Telegram 看。</p>", media: [{ kind: "video", tooLarge: true, poster: "https://picsum.photos/seed/vlog/1280/720", w: 1280, h: 720, duration: 312 }], tags: ["旅行"] },
  { id: 1, at: at(5, 9, 0), html: "<p>新的碎碎念基地，开张 🎉</p>", media: [pic("desk1", 1000, 700), pic("desk2", 1000, 700), pic("desk3", 1000, 700), pic("desk4", 1000, 700)] },
];
// 更早的纯文字碎碎念，让热力图 / 日期筛选有东西可看
const FILLER = [
  ["又是被闹钟打败的一天。", "日常"], ["读完了《置身事内》，比想象中好读。", "读书"], ["今天的咖啡太酸了。", "吃"],
  ["重构了一下午，删掉的代码比写的多，舒服。", "折腾"], ["下雨，适合在家发呆。", "日常"], ["夜跑 3 公里，膝盖有点抗议。", "跑步"],
  ["《海边的曼彻斯特》二刷，还是很难受。", "电影"], ["猫学会了开柜门，家里没有秘密了。", "猫"], ["把 Obsidian 的插件砍到只剩 5 个。", "折腾"],
  ["周五晚上的地铁，每个人都很累但很开心。", "日常"], ["试着早睡，失败。", null], ["买了一台胶片机，等第一卷冲洗。", "摄影"],
];
{
  let s = 42; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 46; i++) {
    const [t, tag] = FILLER[Math.floor(r() * FILLER.length)];
    POSTS.push({ id: 100 + i, at: at(7 + Math.floor(r() * 130), 7 + Math.floor(r() * 16), Math.floor(r() * 60)), html: `<p>${t}</p>`, media: [], tags: tag ? [tag] : [] });
  }
  POSTS.sort((a, b) => b.at - a.at);
}
POSTS.forEach(p => {
  const inline = [...p.html.matchAll(/data-tag='([^']+)'/g)].map(m => m[1]);
  p.tags = [...new Set([...(p.tags || []), ...inline])];
  p.text = p.html.replace(/<[^>]+>/g, "");
});

/* ── State ── */
// from / to：当天 00:00 的时间戳，from === to 表示单日
const state = { tag: null, q: "", from: null, to: null };
const $ = s => document.querySelector(s);
const WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const dayStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
const addDays = (t, n) => { const x = new Date(t); x.setDate(x.getDate() + n); return x.getTime(); };
const TODAY = dayStart(now);
const fmtMD = t => { const d = new Date(t); return `${d.getMonth() + 1}月${d.getDate()}日`; };
const dayCount = {};
POSTS.forEach(p => { const k = dayStart(p.at); dayCount[k] = (dayCount[k] || 0) + 1; });
const inRange = t => state.from != null && t >= state.from && t <= state.to;
const fmtDur = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function relDay(d) {
  const diff = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  return diff === 0 ? "今天" : diff === 1 ? "昨天" : diff < 7 ? `${diff} 天前` : "";
}

function highlight(html, q) {
  if (!q) return html;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
  return html.split(/(<[^>]+>)/).map(part => part.startsWith("<") ? part : part.replace(re, "<mark>$1</mark>")).join("");
}

/* ── Media grid ── */
function mediaHTML(post) {
  const list = post.media;
  if (!list.length) return "";
  const n = list.length;
  const cls = n === 1 ? "g1" : n === 2 ? "g2" : n === 3 ? "g3" : n === 4 ? "g4" : "gn";
  const shown = list.slice(0, 9);
  const photos = list.filter(m => m.kind === "photo");
  const cells = shown.map((m, i) => {
    const ratio = n === 1 ? `style="aspect-ratio:${m.w}/${m.h}"` : "";
    if (m.kind === "photo") {
      const idx = photos.indexOf(m);
      const more = i === 8 && n > 9 ? `<div class="more-badge">+${n - 9}</div>` : "";
      return `<div class="m" ${ratio} data-post="${post.id}" data-idx="${idx}"><img loading="lazy" src="${m.url}" alt="">${more}</div>`;
    }
    if (m.kind === "gif") {
      return `<div class="m" ${ratio} style="cursor:default"><video src="${m.url}" poster="${m.poster}" autoplay loop muted playsinline></video><span class="gif-badge">GIF</span></div>`;
    }
    if (m.tooLarge) {
      return `<div class="m" ${ratio} style="cursor:default"><img loading="lazy" src="${m.poster}" alt=""><div class="too-large"><a href="#">视频较大 · 在 Telegram 中观看 ↗</a></div><span class="duration">${fmtDur(m.duration)}</span></div>`;
    }
    return `<div class="m video" ${ratio} data-video="${m.url}"><img loading="lazy" src="${m.poster}" alt=""><div class="play"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div><span class="duration">${fmtDur(m.duration)}</span></div>`;
  }).join("");
  return `<div class="grid ${cls}">${cells}</div>`;
}

/* ── 转发来源 & 链接卡片 ── */
function forwardHTML(p) {
  if (!p.forward) return "";
  const name = esc(p.forward.name);
  return `<div class="fwd"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5V20"/></svg>转发自 ${p.forward.url ? `<a href="${p.forward.url}">${name}</a>` : name}</div>`;
}
function linkHTML(p) {
  const l = p.link;
  if (!l || p.media.length) return "";   // 带媒体的帖子不出卡片，和 Telegram 一致
  const body = `<div class="link-body"><div class="link-site">${esc(l.site)}</div><div class="link-title">${esc(l.title)}</div><div class="link-desc">${esc(l.desc)}</div></div>`;
  return l.layout === "large"
    ? `<a class="link-card" href="${l.url}" target="_blank" rel="noopener"><img class="cover" loading="lazy" src="${l.image}" alt="">${body}</a>`
    : `<a class="link-card small" href="${l.url}" target="_blank" rel="noopener">${body}<img class="thumb" loading="lazy" src="${l.image}" alt=""></a>`;
}

/* ── Render timeline ── */
function render() {
  const q = state.q.trim().toLowerCase();
  const list = POSTS.filter(p =>
    (!state.tag || p.tags.includes(state.tag)) &&
    (!q || p.text.toLowerCase().includes(q)) &&
    (state.from == null || inRange(dayStart(p.at))));

  const dateLabel = state.from == null ? "" : state.from === state.to ? fmtMD(state.from) : `${fmtMD(state.from)} – ${fmtMD(state.to)}`;
  $("#filter").innerHTML = state.tag || q || dateLabel
    ? `<span>${list.length} 条结果</span>`
      + (dateLabel ? `<button class="tag-chip" data-clear="date">${dateLabel} ✕</button>` : "")
      + (state.tag ? `<button class="tag-chip" data-clear="tag">#${esc(state.tag)} ✕</button>` : "")
      + (q ? `<button class="tag-chip" data-clear="q">“${esc(state.q)}” ✕</button>` : "")
    : "";
  $("#cal-btn").classList.toggle("on", state.from != null);

  if (!list.length) { $("#timeline").innerHTML = `<div class="empty">什么也没找到 ¯\\_(ツ)_/¯</div>`; return; }

  let html = "", last = null;
  list.forEach((p, i) => {
    const k = dayKey(p.at);
    if (k !== last) {
      if (last) html += "</section>";
      const rel = relDay(p.at);
      html += `<section class="day"><div class="day-head"><span class="day-num">${p.at.getDate()}</span><span class="day-meta">${p.at.getMonth() + 1} 月 · ${WEEK[p.at.getDay()]}${rel ? `<em>${rel}</em>` : ""}</span></div>`;
      last = k;
    }
    html += `<article class="post" style="animation-delay:${Math.min(i, 8) * 40}ms">
      <div class="post-time">${pad(p.at.getHours())}:${pad(p.at.getMinutes())}${p.edited ? `<span class="edited">· 已编辑</span>` : ""}</div>
      ${forwardHTML(p)}
      <div class="content">${highlight(p.html, q)}</div>
      ${mediaHTML(p)}
      ${linkHTML(p)}
      <div class="post-actions">
        <button data-copy="${p.id}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>复制链接</button>
        <a href="#" title="在 Telegram 中查看"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>Telegram</a>
      </div>
    </article>`;
  });
  html += `</section><div class="end">— 到底啦 —</div>`;
  $("#timeline").innerHTML = html;
}

/* ── Sidebar ── */
function renderSide() {
  $("#st-posts").textContent = POSTS.length;
  $("#st-days").textContent = new Set(POSTS.map(p => dayKey(p.at))).size;
  $("#st-media").textContent = POSTS.reduce((s, p) => s + p.media.length, 0);

  const count = {};
  POSTS.forEach(p => p.tags.forEach(t => count[t] = (count[t] || 0) + 1));
  $("#tags").innerHTML = Object.entries(count).sort((a, b) => b[1] - a[1])
    .map(([t, c]) => `<button class="tag-chip${state.tag === t ? " active" : ""}" data-tag="${esc(t)}">#${esc(t)}<small>${c}</small></button>`).join("");

  renderHeatmap();
}

// 20 周，按列=周、行=星期排布，最后一列截止到今天（真实数据来自 /api/stats/heatmap）
function renderHeatmap() {
  const start = addDays(TODAY, -(19 * 7 + new Date(TODAY).getDay()));
  const cells = [];
  for (let t = start; t <= TODAY; t = addDays(t, 1)) {
    const c = dayCount[t] || 0;
    const l = Math.min(c, 4);
    cells.push(`<i data-l="${l}" data-day="${t}" class="${inRange(t) ? "sel" : ""}" title="${fmtMD(t)} · ${c ? c + " 条" : "没有碎碎念"}"></i>`);
  }
  $("#heatmap").innerHTML = cells.join("");
}

function setRange(from, to) {
  if (from != null && to < from) [from, to] = [to, from];
  state.from = from; state.to = to;
  renderHeatmap(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── Date picker ── */
const cal = { el: $("#cal"), month: new Date(new Date(TODAY).setDate(1)), pending: false };
function renderCal() {
  const y = cal.month.getFullYear(), m = cal.month.getMonth();
  $("#cal-title").textContent = `${y} 年 ${m + 1} 月`;
  const first = new Date(y, m, 1).getTime();
  const gridStart = addDays(first, -new Date(first).getDay());
  let html = "";
  for (let i = 0; i < 42; i++) {
    const t = addDays(gridStart, i), d = new Date(t);
    if (i >= 35 && d.getMonth() !== m) break;
    const cls = [
      d.getMonth() !== m && "out", dayCount[t] && "has", t === TODAY && "today",
      inRange(t) && "r-in", t === state.from && "r-start", t === state.to && "r-end",
    ].filter(Boolean).join(" ");
    html += `<button data-d="${t}" class="${cls}" ${t > TODAY ? "disabled" : ""} title="${dayCount[t] ? dayCount[t] + " 条" : ""}"><span>${d.getDate()}</span></button>`;
  }
  $("#cal-days").innerHTML = html;
  $("#cal-hint").textContent = cal.pending ? `已选 ${fmtMD(state.from)}，再点一天组成区间` : "点一下选单日，再点一下选成区间";
}
const mobile = matchMedia("(max-width: 760px)");
function toggleCal(open = cal.el.hidden) {
  cal.el.hidden = !open;
  document.body.classList.toggle("sheet-open", open && mobile.matches);
  $("#cal-btn").setAttribute("aria-expanded", open);
  if (open) {
    if (state.from != null) cal.month = new Date(new Date(state.to).setDate(1));
    renderCal();
  } else cal.pending = false;
}
$("#cal-btn").addEventListener("click", e => { e.stopPropagation(); toggleCal(); });
cal.el.addEventListener("click", e => {
  e.stopPropagation();
  const nav = e.target.closest("[data-cal]");
  if (nav) { cal.month = new Date(cal.month.getFullYear(), cal.month.getMonth() + +nav.dataset.cal, 1); return renderCal(); }
  const day = e.target.closest("[data-d]");
  if (day && !day.disabled) {
    const t = +day.dataset.d;
    if (cal.pending) { cal.pending = false; setRange(state.from, t); toggleCal(false); }
    else { cal.pending = true; setRange(t, t); renderCal(); }
    return;
  }
  const pre = e.target.closest("[data-preset]");
  if (pre) {
    const v = pre.dataset.preset;
    v === "clear" ? setRange(null, null) : setRange(addDays(TODAY, -+v), TODAY);
    toggleCal(false);
  }
});
document.addEventListener("click", () => { if (!cal.el.hidden) toggleCal(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !cal.el.hidden) toggleCal(false); });

/* ── Interactions ── */
function setTag(t) { state.tag = state.tag === t ? null : t; renderSide(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

document.addEventListener("click", e => {
  const tagEl = e.target.closest("[data-tag]");
  if (tagEl) { e.preventDefault(); return setTag(tagEl.dataset.tag); }

  const hm = e.target.closest(".heatmap [data-day]");
  if (hm) { const t = +hm.dataset.day; return state.from === t && state.to === t ? setRange(null, null) : setRange(t, t); }

  const clr = e.target.closest("[data-clear]");
  if (clr) {
    const k = clr.dataset.clear;
    if (k === "tag") setTag(state.tag);
    else if (k === "date") setRange(null, null);
    else { state.q = ""; $("#q").value = ""; render(); }
    return;
  }

  const sp = e.target.closest(".spoiler");
  if (sp) return sp.classList.toggle("show");

  const vid = e.target.closest("[data-video]");
  if (vid) { vid.innerHTML = `<video src="${vid.dataset.video}" controls autoplay playsinline></video>`; vid.removeAttribute("data-video"); vid.style.cursor = "default"; return; }

  const ph = e.target.closest("[data-post][data-idx]");
  if (ph) return openLB(+ph.dataset.post, +ph.dataset.idx);

  const cp = e.target.closest("[data-copy]");
  if (cp) { navigator.clipboard?.writeText(`${location.origin}/p/${cp.dataset.copy}`).catch(() => {}); return toast("链接已复制"); }
});

let qTimer;
$("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 150); });

/* theme */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
$("#theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
});

/* lightbox */
const lb = { el: $("#lb"), img: $("#lb-img"), list: [], i: 0 };
function openLB(postId, idx) {
  lb.list = POSTS.find(p => p.id === postId).media.filter(m => m.kind === "photo");
  lb.i = idx; showLB(); lb.el.classList.add("open"); document.body.style.overflow = "hidden";
}
function showLB() {
  lb.img.src = lb.list[lb.i].url;
  $("#lb-count").textContent = lb.list.length > 1 ? `${lb.i + 1} / ${lb.list.length}` : "";
  lb.el.querySelectorAll(".lb-prev,.lb-next").forEach(b => b.style.visibility = lb.list.length > 1 ? "visible" : "hidden");
}
function closeLB() { lb.el.classList.remove("open"); document.body.style.overflow = ""; }
function step(d) { lb.i = (lb.i + d + lb.list.length) % lb.list.length; showLB(); }
lb.el.addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "close" || e.target === lb.el) closeLB();
  else if (act === "prev") step(-1);
  else if (act === "next") step(1);
});
document.addEventListener("keydown", e => {
  if (!lb.el.classList.contains("open")) return;
  if (e.key === "Escape") closeLB(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
});
// 左右滑切换；下滑跟手，超过阈值关闭
let tx = 0, ty = 0;
lb.el.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
lb.el.addEventListener("touchmove", e => {
  const dy = e.touches[0].clientY - ty;
  if (dy > 0 && Math.abs(dy) > Math.abs(e.touches[0].clientX - tx)) {
    lb.img.style.transition = "none";
    lb.img.style.transform = `translateY(${dy}px) scale(${1 - Math.min(dy, 300) / 1200})`;
    lb.el.style.background = `rgba(12,10,8,${.92 - Math.min(dy, 300) / 500})`;
  }
}, { passive: true });
lb.el.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  lb.img.style.transition = lb.img.style.transform = lb.el.style.background = "";
  if (dy > 90 && dy > Math.abs(dx)) closeLB();
  else if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1600); }

/* ── Mobile：底部抽屉下滑关闭 ── */
let sy = 0;
cal.el.addEventListener("touchstart", e => { sy = e.touches[0].clientY; }, { passive: true });
cal.el.addEventListener("touchmove", e => {
  const dy = e.touches[0].clientY - sy;
  if (mobile.matches && dy > 0 && cal.el.scrollTop <= 0) { cal.el.style.transition = "none"; cal.el.style.transform = `translateY(${dy}px)`; }
}, { passive: true });
cal.el.addEventListener("touchend", e => {
  const dy = e.changedTouches[0].clientY - sy;
  cal.el.style.transform = cal.el.style.transition = "";
  if (mobile.matches && dy > 80) toggleCal(false);
});

/* ── Mobile：吸顶栏高度 → 日期标题的吸顶偏移；滚动后显示分隔线 / 回到顶部 ── */
const topbar = $("#topbar"), toTop = $("#to-top");
const syncStick = () => root.style.setProperty("--stick", mobile.matches ? topbar.offsetHeight + "px" : "0px");
new ResizeObserver(syncStick).observe(topbar);
mobile.addEventListener("change", () => { syncStick(); if (!cal.el.hidden) toggleCal(false); });
const onScroll = () => {
  topbar.classList.toggle("stuck", mobile.matches && topbar.getBoundingClientRect().top <= 0 && scrollY > 0);
  toTop.classList.toggle("show", scrollY > 900);
};
addEventListener("scroll", onScroll, { passive: true });
toTop.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));

renderSide();
render();
syncStick();
</script>
</body>
</html>
